version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: ai_backend
    env_file:
      - .env
    volumes:
      - ./app/interview.db:/code/app/interview.db
    networks:
      - ai_network
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./react
      dockerfile: Dockerfile
    container_name: ai_frontend
    ports:
      - "80:80"
    networks:
      - ai_network
    depends_on:
      backend:
        condition: service_healthy

  minio:
    image: minio/minio
    container_name: ai_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  ai_network:
    driver: bridge

volumes:
  minio_data: